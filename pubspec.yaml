name: workout_tracker
description: "A workout tracking app for progressive overload training."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.0.0
  path: ^1.8.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  uuid: ^4.5.1

  # Charts (used in a future slice)
  fl_chart: ^0.70.2

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.26.1
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
